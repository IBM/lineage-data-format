name: Publish to PyPI

# Publishes automatically when a push to main contains a version that is not on PyPI yet.
# A push that does not bump the version does nothing. Can also be started by hand.
on:
  push:
    branches: ["main"]
    paths:
      - "pyproject.toml"
  workflow_dispatch:

# Least privilege for every job; the publish job below raises it explicitly.
permissions:
  contents: read

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.pypi.outputs.publish }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml version: $VERSION"

      - name: Check that ldf.__version__ matches
        run: |
          INIT_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/ldf/__init__.py').read()).group(1))")
          if [ "$INIT_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::src/ldf/__init__.py has $INIT_VERSION but pyproject.toml has ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check whether this version is already on PyPI
        id: pypi
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/lineage-data-format/${{ steps.version.outputs.version }}/json")
          if [ "$STATUS" = "200" ]; then
            echo "Version ${{ steps.version.outputs.version }} is already on PyPI, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected HTTP status $STATUS from PyPI"
            exit 1
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    # Pinned: ubuntu-latest is Ubuntu 26.04, which has no prebuilt Python 3.9.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -q

  build:
    name: Build distributions
    needs: [check-version, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Check artifact names match the version
        run: |
          ls dist
          test -f "dist/lineage_data_format-${{ needs.check-version.outputs.version }}.tar.gz"
          test -f "dist/lineage_data_format-${{ needs.check-version.outputs.version }}-py3-none-any.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [check-version, build]
    runs-on: ubuntu-latest
    # Needs a "pypi" environment in the repo settings (optionally with required reviewers).
    environment:
      name: pypi
      url: https://pypi.org/project/lineage-data-format/${{ needs.check-version.outputs.version }}/
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC), no API token stored in GitHub
      contents: write   # to push the release tag

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag the release
        run: |
          TAG="v${{ needs.check-version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release ${{ needs.check-version.outputs.version }}"
            git push origin "$TAG"
          fi
